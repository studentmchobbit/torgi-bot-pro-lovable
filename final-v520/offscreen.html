<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Offscreen документ — держит Service Worker активным.
// AUDIO_PLAYBACK reason не даёт Chrome заморозить SW.
const audioCtx = new AudioContext();
const buf = audioCtx.createBuffer(1, 44100, 44100);
const src = audioCtx.createBufferSource();
src.buffer = buf;
src.loop = true;
src.connect(audioCtx.destination);
src.start();
</script>
</body>
</html>
